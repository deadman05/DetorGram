name: Build DetorGram APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (standalone = Release APK, debug = Fast Test APK)'
        required: true
        default: 'standalone'
        type: choice
        options:
          - standalone
          - debug
      arch:
        description: 'CPU Architecture (arm64 = Fast ~15m, afat = Universal ~50m)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - afat

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h

      - name: Checkout DetorGram source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build yasm nasm gperf meson pkg-config
          if command -v rustup >/dev/null 2>&1; then
            if [ "${{ inputs.arch }}" = "arm64" ]; then
              rustup target add aarch64-linux-android || true
            else
              rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android || true
            fi
          fi

      - name: Install Android SDK 36, NDK 27 & CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Limit native build to arm64-v8a (Fast Build)
        if: ${{ inputs.arch == 'arm64' }}
        run: |
          python3 - << 'EOF'
          import pathlib, re

          pattern = re.compile(r'abiFilters\s+["\'][^"\']+["\'](?:\s*,\s*["\'][^"\']+["\'])+')
          for file_path in ["TMessagesProj/build.gradle", "TMessagesProj_AppStandalone/build.gradle"]:
              p = pathlib.Path(file_path)
              if not p.exists():
                  continue
              text = p.read_text()
              new_text, count = pattern.subn('abiFilters "arm64-v8a"', text)
              if count:
                  p.write_text(new_text)
                  print(f"Patched {count} abiFilters block(s) in {file_path}")
          EOF
          grep -n "abiFilters" TMessagesProj/build.gradle TMessagesProj_AppStandalone/build.gradle || true

      - name: Decode release keystore
        run: |
          mkdir -p TMessagesProj/config
          echo "${{ secrets.SIGNING_KEY }}" | tr -d '\n\r ' | base64 --decode > TMessagesProj/config/release.keystore
          ls -lh TMessagesProj/config/release.keystore

      - name: Build DetorGram APK
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            TASK=":TMessagesProj_AppStandalone:assembleAfatDebug"
          else
            TASK=":TMessagesProj_AppStandalone:assembleAfatStandalone"
          fi
          ./gradlew $TASK \
            --no-daemon \
            --max-workers=4 \
            -PRELEASE_STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Upload DetorGram APK
        uses: actions/upload-artifact@v4
        with:
          name: DetorGram-${{ inputs.build_type }}-${{ inputs.arch }}-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
